<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSME · the bag that knows its temperature</title>
<style>
/* OSME brand tokens - "Midnight Brew" (values copied inline from brand/identity/tokens.css) */
:root {
  --brand-bg:       #0B0B0D;
  --brand-surface:  #17171B;
  --brand-line:     #2A2A30;
  --brand-primary:  #F2A33A;
  --brand-accent:   #3DBA9B;
  --brand-text:     #F3EEE6;
  --brand-muted:    #8E8A83;
  --brand-arc-hot:  #F2A33A;
  --brand-arc-mid:  #D9C46B;
  --brand-arc-cool: #3DBA9B;
  --brand-arc: linear-gradient(90deg, var(--brand-arc-hot) 0%, var(--brand-arc-mid) 48%, var(--brand-arc-cool) 100%);
  --brand-glow: 0 0 24px rgba(242,163,58,.35), 0 0 48px rgba(61,186,155,.18);
  --font-display: "Futura", "Jost", "Century Gothic", "Avenir Next", sans-serif;
  --font-body:    "Avenir Next", "Avenir", "Inter", "Helvetica Neue", Arial, sans-serif;
  --fw-display: 500;
  --tracking-display: 0.18em;
  --fs-hero: clamp(48px, 7vw, 96px);
  --fs-h1: 48px; --fs-h2: 32px; --fs-h3: 22px; --fs-body: 17px; --fs-small: 13px;
  --space-1: 4px;  --space-2: 8px;  --space-3: 16px; --space-4: 24px;
  --space-5: 32px; --space-6: 48px; --space-7: 64px; --space-8: 96px;
  --radius-s: 4px; --radius-m: 10px; --radius-l: 20px; --radius-pill: 999px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(ellipse 80% 60% at 50% 30%, #131317 0%, var(--brand-bg) 70%);
  color: var(--brand-text); font-family: var(--font-body); font-size: var(--fs-body);
  display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
}
.caps { font-family: var(--font-display); font-weight: var(--fw-display); letter-spacing: var(--tracking-display); text-transform: uppercase; }
header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-6) var(--space-3); }
header .tag { color: var(--brand-muted); font-size: var(--fs-small); }
.teas { display: flex; gap: var(--space-2); padding: 0 var(--space-6); flex-wrap: wrap; }
.tea {
  flex: 1 1 0; min-width: 140px; background: transparent; color: var(--brand-text);
  border: 1px solid var(--brand-line); border-radius: var(--radius-m);
  padding: 10px 14px; text-align: left; cursor: pointer; font-family: var(--font-body);
  transition: border-color .3s, background .3s;
}
.tea:hover { border-color: #44444c; }
.tea b { display: block; font-family: var(--font-display); font-weight: var(--fw-display); letter-spacing: .08em; font-size: 15px; }
.tea span { color: var(--brand-muted); font-size: 12px; }
.tea.on { border-color: var(--brand-primary); background: rgba(242,163,58,.07); box-shadow: 0 0 18px rgba(242,163,58,.12); }
main { flex: 1; display: grid; grid-template-columns: minmax(340px, 4fr) 7fr; gap: var(--space-5); padding: var(--space-4) var(--space-6) var(--space-3); align-items: center; }
.gauge { position: relative; text-align: center; }
.gauge svg { width: 100%; max-width: 460px; display: block; margin: 0 auto; overflow: visible; }
.readout { font-family: var(--font-display); font-size: 84px; line-height: 1; letter-spacing: .02em; }
.readout small { font-size: 32px; color: var(--brand-muted); margin-left: 4px; }
.stage { margin-top: var(--space-3); display: flex; align-items: center; justify-content: center; gap: var(--space-3); min-height: 44px; }
.dots { display: flex; gap: 7px; align-items: center; }
.dots i { display: block; border-radius: 50%; background: var(--brand-line); transition: background .5s, box-shadow .5s; }
.dots i:nth-child(1) { width: 9px; height: 9px; }
.dots i:nth-child(2) { width: 12px; height: 12px; }
.dots i:nth-child(3) { width: 16px; height: 16px; }
.dots i.lit { background: var(--brand-primary); box-shadow: 0 0 10px rgba(242,163,58,.6); }
.stage-name { text-align: left; }
.stage-name b { display: block; font-family: var(--font-display); font-weight: var(--fw-display); letter-spacing: .12em; text-transform: uppercase; font-size: 15px; }
.stage-name span { color: var(--brand-muted); font-size: var(--fs-small); }
.ritual { margin: var(--space-4) auto 0; max-width: 420px; color: var(--brand-muted); font-size: 15px; line-height: 1.5; min-height: 46px; }
.ritual em { color: var(--brand-text); font-style: normal; }
.clock { margin-top: var(--space-2); color: var(--brand-muted); font-size: var(--fs-small); letter-spacing: .06em; }
.cups { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.cup { background: linear-gradient(180deg, rgba(23,23,27,.85), rgba(23,23,27,.4)); border: 1px solid var(--brand-line); border-radius: var(--radius-l); padding: var(--space-3) var(--space-4) var(--space-4); text-align: center; transition: border-color .6s, box-shadow .6s; }
.cup.osme.open { border-color: rgba(242,163,58,.55); box-shadow: var(--brand-glow); }
.cup.osme.sealed { border-color: rgba(61,186,155,.55); box-shadow: 0 0 28px rgba(61,186,155,.18); }
.cup h3 { margin: 0; font-size: 13px; color: var(--brand-muted); }
.cup h3 b { color: var(--brand-text); }
.cup svg { width: 100%; max-width: 300px; height: auto; display: block; margin: 6px auto 4px; overflow: visible; }
.status { font-family: var(--font-display); font-weight: var(--fw-display); font-size: 19px; letter-spacing: .03em; min-height: 52px; line-height: 1.3; }
.status small { display: block; font-family: var(--font-body); color: var(--brand-muted); font-size: 13px; letter-spacing: 0; margin-top: 3px; }
.osme .status.s-open { color: var(--brand-primary); }
.osme .status.s-sealed { color: var(--brand-accent); }
.old .status.s-bitter { color: #C9775A; }
.count { margin-top: var(--space-2); font-size: 12px; color: var(--brand-muted); letter-spacing: .08em; }
footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-6) var(--space-4); border-top: 1px solid var(--brand-line); flex-wrap: wrap; }
.btn { font-family: var(--font-display); font-weight: var(--fw-display); letter-spacing: .14em; text-transform: uppercase; font-size: 13px; border-radius: var(--radius-pill); padding: 12px 22px; cursor: pointer; border: 1px solid var(--brand-line); background: transparent; color: var(--brand-text); transition: all .25s; }
.btn:hover:not(:disabled) { border-color: #55555e; }
.btn:disabled { opacity: .35; cursor: default; }
.btn.primary { background: var(--brand-primary); color: #1a1206; border-color: var(--brand-primary); box-shadow: 0 0 20px rgba(242,163,58,.3); }
.btn.jade { border-color: var(--brand-accent); color: var(--brand-accent); }
.btn.jade.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 22px rgba(61,186,155,.45); } }
.group { display: flex; gap: var(--space-2); align-items: center; }
.seg { display: flex; border: 1px solid var(--brand-line); border-radius: var(--radius-pill); overflow: hidden; }
.seg button { background: transparent; border: 0; color: var(--brand-muted); padding: 10px 14px; font-family: var(--font-display); font-size: 13px; cursor: pointer; letter-spacing: .08em; }
.seg button.on { color: var(--brand-text); background: var(--brand-line); }
.hint { color: var(--brand-muted); font-size: 12px; }
/* SVG animation helpers */
.wisp { fill: none; stroke: var(--brand-text); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 6 10; animation: rise 3.2s linear infinite; }
.wisp.w2 { animation-duration: 4.1s; animation-delay: -1.2s; }
.wisp.w3 { animation-duration: 3.6s; animation-delay: -2.1s; }
@keyframes rise { to { stroke-dashoffset: -64; } }
.drift { animation: drift 5s ease-in-out infinite alternate; }
.drift.d2 { animation-duration: 6.5s; animation-delay: -2s; }
.drift.d3 { animation-duration: 7.3s; animation-delay: -4s; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(14px, -18px) scale(1.35); } }
.sway { animation: sway 6s ease-in-out infinite alternate; transform-origin: 150px 20px; }
@keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }
:fullscreen body, body:fullscreen { background: var(--brand-bg); }
</style>
</head>
<body>
<header>
  <svg width="122" height="32" viewBox="0 0 152.5 40" aria-label="OSME"><defs><linearGradient id="arcw" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="40" y2="0"><stop offset="0" stop-color="#F2A33A"/><stop offset=".48" stop-color="#D9C46B"/><stop offset="1" stop-color="#3DBA9B"/></linearGradient></defs><circle cx="20" cy="20" r="17.5" fill="none" stroke="url(#arcw)" stroke-width="5"/><path d="M66.30 7.75 A8.75 8.75 0 1 0 58.25 20.00 A8.75 8.75 0 1 1 50.20 32.25" fill="none" stroke="#F3EEE6" stroke-width="5"/><path d="M84.50 40 V2.50 L99.50 24.80 L114.50 2.50 V40" fill="none" stroke="#F3EEE6" stroke-width="5" stroke-linejoin="miter" stroke-miterlimit="10"/><path d="M150 2.5 H129.5 V37.5 H150 M129.5 20 H146.5" fill="none" stroke="#F3EEE6" stroke-width="5"/></svg>
  <div class="tag caps">Every tea has its temperature</div>
</header>

<nav class="teas" id="teas" aria-label="Choose a tea"></nav>

<main>
  <section class="gauge">
    <svg viewBox="0 0 400 220" id="gaugeSvg" aria-hidden="true">
      <defs>
        <linearGradient id="arcg" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="370" y2="0">
          <stop offset="0" stop-color="#F2A33A"/><stop offset=".48" stop-color="#D9C46B"/><stop offset="1" stop-color="#3DBA9B"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path id="arcBase" d="M30 200 A170 170 0 0 1 370 200" fill="none" stroke="#2A2A30" stroke-width="14" stroke-linecap="round"/>
      <path id="arcDone" d="M30 200 A170 170 0 0 1 370 200" fill="none" stroke="url(#arcg)" stroke-width="14" stroke-linecap="round" opacity=".9"/>
      <path id="win" fill="none" stroke="#F3EEE6" stroke-width="26" stroke-linecap="butt" opacity=".13"/>
      <path id="winEdge" fill="none" stroke="#F3EEE6" stroke-width="2" stroke-dasharray="2 5" opacity=".55"/>
      <g id="ticks"></g>
      <text id="winLabel" text-anchor="middle" fill="#F3EEE6" font-size="12" letter-spacing="1.5" font-family="Futura, Jost, 'Century Gothic', 'Avenir Next', sans-serif"></text>
      <circle id="needle" r="11" fill="#F3EEE6" filter="url(#glow)"/>
      <circle id="needleCore" r="5" fill="#0B0B0D"/>
    </svg>
    <div style="margin-top:-118px">
      <div class="readout" id="temp">--<small>°C</small></div>
      <div class="clock" id="clock">Choose a tea, then pour</div>
    </div>
    <div class="stage">
      <div class="dots" id="dots"><i></i><i></i><i></i></div>
      <div class="stage-name"><b id="stageName">Lu Yu's water</b><span id="stageNote">The Classic of Tea, 8th century</span></div>
    </div>
    <p class="ritual" id="ritual"></p>
  </section>

  <section class="cups">
    <div class="cup osme" id="cupOsme">
      <h3 class="caps"><b>OSME</b> bag</h3>
      <svg viewBox="0 0 300 300" id="svgOsme" aria-label="OSME bag in a cup">
        <defs>
          <clipPath id="glassClipA"><path d="M62 70 L80 262 Q82 276 98 276 L202 276 Q218 276 220 262 L238 70 Z"/></clipPath>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
          <filter id="softS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
          <linearGradient id="bagFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE6DA" stop-opacity=".92"/><stop offset="1" stop-color="#BDB5A8" stop-opacity=".85"/></linearGradient>
          <linearGradient id="glassSheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient>
        </defs>
        <!-- scent wisps -->
        <g id="wispA" opacity="0">
          <path class="wisp" d="M132 66 C120 46 146 34 134 12 C128 0 140 -10 136 -22"/>
          <path class="wisp w2" d="M152 64 C164 44 140 30 154 8 C160 -2 150 -12 156 -24"/>
          <path class="wisp w3" d="M170 66 C160 50 182 36 172 16 C168 6 176 -4 172 -14"/>
        </g>
        <g clip-path="url(#glassClipA)">
          <rect id="waterA" x="40" y="276" width="220" height="0" fill="#C9C76A" fill-opacity=".08"/>
          <g id="cloudA" opacity="0">
            <circle class="drift" cx="132" cy="200" r="26" fill="#C9C76A" filter="url(#soft)"/>
            <circle class="drift d2" cx="172" cy="214" r="22" fill="#C9C76A" filter="url(#soft)"/>
            <circle class="drift d3" cx="150" cy="168" r="18" fill="#C9C76A" filter="url(#soft)"/>
          </g>
        </g>
        <!-- the OSME bag -->
        <g class="sway">
          <line x1="150" y1="20" x2="150" y2="148" stroke="#8E8A83" stroke-width="1"/>
          <path d="M150 20 Q168 18 212 30" stroke="#8E8A83" stroke-width="1" fill="none"/>
          <g transform="translate(212 24)"><rect x="0" y="0" width="34" height="22" rx="3" fill="#17171B" stroke="#2A2A30"/><path d="M23.6 10 A6.3 6.3 0 1 1 18.6 5.4" fill="none" stroke="url(#arcg)" stroke-width="1.8" stroke-linecap="round"/><circle cx="21.5" cy="6.5" r="1.6" fill="#F2A33A"/></g>
          <g id="bagA" transform="translate(150 196)">
            <!-- leaves that show when open -->
            <g id="leavesA" opacity="0">
              <ellipse cx="-14" cy="-40" rx="9" ry="3.4" fill="#6F7E3A" transform="rotate(-24 -14 -40)"/>
              <ellipse cx="2" cy="-44" rx="10" ry="3.6" fill="#7E8C43" transform="rotate(12 2 -44)"/>
              <ellipse cx="15" cy="-38" rx="8" ry="3" fill="#5F6E33" transform="rotate(38 15 -38)"/>
            </g>
            <path id="bagBody" d="M-34 -36 C-40 -6 -38 26 -22 38 C-10 46 10 46 22 38 C38 26 40 -6 34 -36 Z" fill="url(#bagFill)"/>
            <path d="M-26 -20 C-30 4 -28 22 -16 32" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.4"/>
            <!-- three bubbles motif -->
            <circle cx="-8" cy="14" r="2.6" fill="#3DBA9B"/><circle cx="1" cy="5" r="3.4" fill="#D9C46B"/><circle cx="12" cy="-6" r="4.4" fill="#F2A33A"/>
            <!-- seam: two lips that part when open -->
            <path id="lipL" d="M-36 -38 Q0 -30 36 -38" fill="none" stroke="#D8D0C2" stroke-width="5" stroke-linecap="round"/>
            <path id="lipU" d="M-36 -38 Q0 -46 36 -38" fill="none" stroke="#F3EEE6" stroke-width="5" stroke-linecap="round"/>
            <path id="sealGlow" d="M-36 -38 Q0 -38 36 -38" fill="none" stroke="#3DBA9B" stroke-width="3" stroke-linecap="round" opacity="0" filter="url(#softS)"/>
            <line x1="0" y1="-42" x2="0" y2="-48" stroke="#8E8A83" stroke-width="1"/>
          </g>
        </g>
        <!-- glass -->
        <path d="M62 70 L80 262 Q82 276 98 276 L202 276 Q218 276 220 262 L238 70" fill="url(#glassSheen)" stroke="#F3EEE6" stroke-opacity=".38" stroke-width="2"/>
        <ellipse cx="150" cy="70" rx="88" ry="7" fill="none" stroke="#F3EEE6" stroke-opacity=".3" stroke-width="1.5"/>
        <ellipse cx="150" cy="284" rx="78" ry="5" fill="#000" opacity=".5"/>
      </svg>
      <div class="status" id="statusA">Ready.<small>Pour freshly boiled water.</small></div>
      <div class="count" id="countA">1st infusion · 1 bag</div>
    </div>

    <div class="cup old" id="cupOld">
      <h3 class="caps"><b>1908</b> tea bag</h3>
      <svg viewBox="0 0 300 300" id="svgOld" aria-label="Classic tea bag in a cup">
        <defs>
          <clipPath id="glassClipB"><path d="M62 70 L80 262 Q82 276 98 276 L202 276 Q218 276 220 262 L238 70 Z"/></clipPath>
        </defs>
        <g clip-path="url(#glassClipB)">
          <rect id="waterB" x="40" y="276" width="220" height="0" fill="#C9C76A" fill-opacity=".08"/>
          <g id="cloudB" opacity="0">
            <circle class="drift" cx="140" cy="214" r="34" fill="#C9C76A" filter="url(#soft)"/>
            <circle class="drift d2" cx="168" cy="236" r="30" fill="#C9C76A" filter="url(#soft)"/>
          </g>
        </g>
        <!-- classic flat paper bag, string and tag over the rim -->
        <path d="M150 196 L150 120 Q152 70 232 66 L236 96" stroke="#8E8A83" stroke-width="1" fill="none"/>
        <g transform="translate(224 96)"><rect x="0" y="0" width="26" height="30" fill="#2A2A30" stroke="#3a3a42"/><text x="13" y="19" text-anchor="middle" font-size="8" fill="#8E8A83" font-family="Avenir Next, Arial, sans-serif">1908</text></g>
        <g transform="translate(150 230) rotate(-8)">
          <rect x="-30" y="-36" width="60" height="70" rx="2" fill="#CFC6B6" fill-opacity=".72"/>
          <rect x="-30" y="-36" width="60" height="70" rx="2" fill="none" stroke="#A79E8E" stroke-dasharray="2 3"/>
          <rect id="stainB" x="-30" y="-36" width="60" height="70" rx="2" fill="#3a1c0a" opacity="0"/>
          <rect x="-4" y="-38" width="8" height="4" fill="#9A9AA0"/>
        </g>
        <path d="M62 70 L80 262 Q82 276 98 276 L202 276 Q218 276 220 262 L238 70" fill="url(#glassSheen)" stroke="#F3EEE6" stroke-opacity=".38" stroke-width="2"/>
        <ellipse cx="150" cy="70" rx="88" ry="7" fill="none" stroke="#F3EEE6" stroke-opacity=".3" stroke-width="1.5"/>
        <ellipse cx="150" cy="284" rx="78" ry="5" fill="#000" opacity=".5"/>
      </svg>
      <div class="status" id="statusB">Ready.<small>The bag goes in, the clock starts.</small></div>
      <div class="count" id="countB">1 bag used</div>
    </div>
  </section>
</main>

<footer>
  <div class="group">
    <button class="btn primary" id="pour">Pour boiling water</button>
    <button class="btn jade" id="again" disabled>Brew again</button>
  </div>
  <div class="group">
    <span class="hint">Time-lapse</span>
    <div class="seg" id="speed"><button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button></div>
    <button class="btn" id="reset">Reset</button>
    <button class="btn" id="fs">Full screen</button>
  </div>
</footer>

<script>
(function () {
  "use strict";
  // ---- The teas: windows are typical brewing temperatures; steep = minutes for a full cup in the window.
  var TEAS = [
    { id: "gyokuro",  name: "Gyokuro",           culture: "Japan · Uji",          lo: 50, hi: 60,  steep: 2.0, liquor: "#B8C86A", green: true,  ritual: "Shade-grown and sweet. <em>Cool water, small cup, slow sip.</em>" },
    { id: "sencha",   name: "Sencha",            culture: "Japan · Shizuoka",     lo: 70, hi: 80,  steep: 1.5, liquor: "#C9C25E", green: true,  ritual: "Japan's everyday green. <em>Pour to the last drop; it carries the best of the cup.</em>" },
    { id: "longjing", name: "Longjing",          culture: "China · Hangzhou",     lo: 75, hi: 85,  steep: 2.0, liquor: "#D6C77A", green: true,  ritual: "Dragon Well. <em>Watch the flat leaves stand up and dance.</em>" },
    { id: "tieguanyin", name: "Tieguanyin",      culture: "China · Fujian oolong", lo: 85, hi: 95, steep: 1.0, liquor: "#D9A845", green: false, ritual: "The Iron Goddess. <em>Many short cups; each one opens the leaf a little more.</em>" },
    { id: "puerh",    name: "Pu-erh",            culture: "China · Yunnan",       lo: 95, hi: 100, steep: 0.7, liquor: "#6B2E12", green: false, ritual: "Aged leaf, deep and earthy. <em>Short, hot, again and again.</em>" },
    { id: "eb",       name: "English Breakfast", culture: "Britain",              lo: 90, hi: 100, steep: 2.5, liquor: "#93441A", green: false, ritual: "Britain's morning cup. <em>Freshly boiled, a splash of milk if you like.</em>" }
  ];
  // ---- Cooling: Newton's law, a 250 ml cup in a 22°C room (100 -> 60°C in about 12 minutes).
  var AMB = 22, K = 0.0599, END_T = 44;
  // Real minutes per demo second at 1x: time-lapse runs slower while the bag is open, so the brew can be seen.
  var LAPSE_FAST = 50 / 60, LAPSE_BREW = 15 / 60, POUR_S = 1.4;
  // Lu Yu read water by its bubbles as it boiled; we name them again as the cup settles.
  function luYu(t) {
    if (t >= 96) return { n: 3, name: "Rolling waves", note: "Lu Yu's third boil: water at its hottest" };
    if (t >= 88) return { n: 2, name: "String of pearls", note: "Lu Yu's second boil" };
    if (t >= 78) return { n: 1, name: "Fish eyes", note: "Lu Yu's first boil" };
    return { n: 0, name: "Still water", note: "Calm, soft, for the gentle teas" };
  }
  var $ = function (id) { return document.getElementById(id); };
  var S = { tea: TEAS[1], phase: "idle", t: AMB, realMin: 0, pourT: 0, openMin: 0, bag: "ready", infusion: 1, bags1908: 1, speed: 1, last: 0, sealedAt: null, openedAt: null };

  // ---- gauge geometry: 100°C on the left (hot amber) to 40°C on the right (cool jade)
  var CX = 200, CY = 200, R = 170, TMAX = 100, TMIN = 40;
  function ang(t) { var f = (TMAX - Math.max(TMIN, Math.min(TMAX, t))) / (TMAX - TMIN); return Math.PI * (1 - f); }
  function pt(t, r) { var a = ang(t); r = r || R; return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; }
  function arc(t1, t2, r) { var a = pt(t1, r), b = pt(t2, r); return "M" + a[0].toFixed(1) + " " + a[1].toFixed(1) + " A" + r + " " + r + " 0 0 1 " + b[0].toFixed(1) + " " + b[1].toFixed(1); }
  (function ticks() {
    var g = $("ticks"), h = "";
    for (var t = 40; t <= 100; t += 10) {
      var a = pt(t, 152), b = pt(t, 144), l = pt(t, 128);
      h += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#8E8A83" stroke-width="1.2"/>';
      h += '<text x="' + l[0] + '" y="' + (l[1] + 4) + '" text-anchor="middle" fill="#8E8A83" font-size="11" font-family="Avenir Next, Arial, sans-serif">' + t + '</text>';
    }
    g.innerHTML = h;
  })();

  // ---- colour helpers
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function mix(a, b, f) { a = hex(a); b = hex(b); f = Math.max(0, Math.min(1, f)); return "rgb(" + a.map(function (v, i) { return Math.round(v + (b[i] - v) * f); }).join(",") + ")"; }
  function fmt(min) { var s = Math.max(0, Math.round(min * 60)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
  function ord(n) { return n + (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"); }

  // ---- tea chooser
  var teasEl = $("teas");
  TEAS.forEach(function (tea) {
    var b = document.createElement("button");
    b.className = "tea"; b.dataset.id = tea.id;
    b.innerHTML = "<b>" + tea.name + "</b><span>" + tea.culture + " · " + tea.lo + "-" + tea.hi + "°C</span>";
    b.addEventListener("click", function () { choose(tea.id); });
    teasEl.appendChild(b);
  });
  function choose(id) {
    S.tea = TEAS.filter(function (x) { return x.id === id; })[0] || TEAS[1];
    reset(true);
  }

  function reset(keepTea) {
    S.phase = "idle"; S.t = AMB; S.realMin = 0; S.pourT = 0; S.openMin = 0; S.bag = "ready"; S.infusion = 1; S.bags1908 = 1; S.sealedAt = null; S.openedAt = null;
    render();
  }
  function pour() {
    if (S.phase === "running" || S.phase === "pouring") return;
    S.phase = "pouring"; S.pourT = 0; S.t = 100; S.realMin = 0; S.openMin = 0; S.bag = "waiting"; S.sealedAt = null; S.openedAt = null;
    render();
  }
  function again() {
    if (S.bag !== "sealed" && S.phase !== "done") return;
    S.infusion += 1; S.bags1908 += 1; S.phase = "idle"; pour();
  }

  // ---- simulation step (dt in demo seconds, already multiplied by speed)
  function step(dt) {
    if (S.phase === "pouring") {
      S.pourT += dt;
      if (S.pourT >= POUR_S) { S.phase = "running"; S.pourT = POUR_S; }
    }
    if (S.phase === "pouring" || S.phase === "running") {
      var tea = S.tea;
      var inWin = S.t >= tea.lo && S.t <= tea.hi;
      var lapse = (inWin && S.bag !== "sealed") ? LAPSE_BREW : LAPSE_FAST;
      var dMin = (S.phase === "pouring") ? dt * LAPSE_BREW * 0.4 : dt * lapse;
      S.realMin += dMin;
      S.t = AMB + (100 - AMB) * Math.exp(-K * S.realMin);
      if (S.bag === "waiting" && S.t <= tea.hi && S.t >= tea.lo) { S.bag = "open"; S.openedAt = S.realMin; }
      if (S.bag === "open") { S.openMin += dMin; if (S.t < tea.lo) { S.bag = "sealed"; S.sealedAt = S.realMin; } }
      if (S.phase === "running" && S.t <= END_T) { S.phase = "done"; }
    }
  }

  // ---- render
  function render() {
    var tea = S.tea, t = S.t;
    Array.prototype.forEach.call(teasEl.children, function (b) { b.classList.toggle("on", b.dataset.id === tea.id); });
    // gauge
    $("win").setAttribute("d", arc(tea.hi, tea.lo, R));
    $("winEdge").setAttribute("d", arc(tea.hi, tea.lo, R + 20));
    var lp = pt((tea.hi + tea.lo) / 2, R + 34);
    $("winLabel").setAttribute("x", lp[0]); $("winLabel").setAttribute("y", lp[1]);
    $("winLabel").textContent = tea.name.toUpperCase() + " " + tea.lo + "-" + tea.hi + "°";
    var shown = S.phase === "idle" ? 100 : t;
    var np = pt(shown);
    $("needle").setAttribute("cx", np[0]); $("needle").setAttribute("cy", np[1]);
    $("needleCore").setAttribute("cx", np[0]); $("needleCore").setAttribute("cy", np[1]);
    $("needle").setAttribute("fill", mix("#F2A33A", "#3DBA9B", (100 - shown) / 60));
    $("needle").setAttribute("opacity", S.phase === "idle" ? .35 : 1);
    // remaining arc: from current temperature to cool end shows the glow ahead
    $("arcDone").setAttribute("d", arc(Math.min(99.9, shown), 40, R));
    $("arcDone").setAttribute("opacity", S.phase === "idle" ? .25 : .9);
    $("temp").innerHTML = (S.phase === "idle" ? "--" : Math.round(t)) + "<small>°C</small>";
    $("clock").textContent = S.phase === "idle" ? "Choose a tea, then pour" : "Cup time " + fmt(S.realMin) + "  ·  time-lapse" + (S.bag === "open" ? ", slowed while it brews" : "");
    var st = S.phase === "idle" ? { n: 0, name: "Lu Yu's water", note: "The Classic of Tea, 8th century, read water by its bubbles" } : luYu(t);
    Array.prototype.forEach.call($("dots").children, function (d, i) { d.classList.toggle("lit", S.phase !== "idle" && i < st.n); });
    $("stageName").textContent = st.name; $("stageNote").textContent = st.note;
    $("ritual").innerHTML = tea.culture + ". " + tea.ritual;

    // water level (pour animation)
    var level = S.phase === "idle" ? 0 : Math.min(1, S.pourT / POUR_S);
    var topY = 276 - 186 * level;
    // ---- OSME cup
    var strength = S.openMin > 0 ? (1 - Math.exp(-2.2 * S.openMin / tea.steep)) : 0;
    strength *= Math.max(.7, 1 - (S.infusion - 1) * .1);
    var water = "#9FB5B8";
    var liqA = mix(water, tea.liquor, strength);
    ["waterA"].forEach(function (id) { var r = $(id); r.setAttribute("y", topY); r.setAttribute("height", 276 - topY); r.setAttribute("fill", liqA); r.setAttribute("fill-opacity", (.10 + .62 * strength).toFixed(3)); });
    Array.prototype.forEach.call($("cloudA").children, function (c) { c.setAttribute("fill", tea.liquor); });
    $("cloudA").setAttribute("opacity", S.bag === "open" ? (.25 + .4 * strength).toFixed(2) : 0);
    var open = S.bag === "open";
    $("lipU").setAttribute("d", open ? "M-36 -38 Q0 -60 36 -38" : "M-36 -38 Q0 -42 36 -38");
    $("lipL").setAttribute("d", open ? "M-36 -38 Q0 -26 36 -38" : "M-36 -38 Q0 -35 36 -38");
    $("leavesA").setAttribute("opacity", open ? 1 : 0);
    $("bagBody").setAttribute("d", open ? "M-36 -36 C-44 -4 -40 28 -23 39 C-10 47 10 47 23 39 C40 28 44 -4 36 -36 Z" : "M-34 -36 C-40 -6 -38 26 -22 38 C-10 46 10 46 22 38 C38 26 40 -6 34 -36 Z");
    var sinceSeal = S.sealedAt == null ? 99 : S.realMin - S.sealedAt;
    $("sealGlow").setAttribute("opacity", S.bag === "sealed" ? Math.max(.35, 1 - sinceSeal / 6).toFixed(2) : 0);
    $("wispA").setAttribute("opacity", open ? (.25 + .45 * strength).toFixed(2) : 0);
    var cupA = $("cupOsme"); cupA.classList.toggle("open", open); cupA.classList.toggle("sealed", S.bag === "sealed");
    var sA = $("statusA"), msg, cls = "";
    if (S.phase === "idle") msg = "Ready.<small>Pour freshly boiled water.</small>";
    else if (S.bag === "waiting") msg = "Waiting. Too hot for " + tea.name + ".<small>Sealed until the water reaches " + tea.hi + "°C.</small>";
    else if (open) { msg = "Open. Brewing at " + Math.round(t) + "°C.<small>The scent rises. Brewing " + fmt(S.openMin) + "</small>"; cls = "s-open"; }
    else { msg = "Sealed. The scent is kept for your next cup.<small>Brewed " + fmt(S.openMin) + ", stopped by itself at " + tea.lo + "°C.</small>"; cls = "s-sealed"; }
    sA.innerHTML = msg; sA.className = "status " + cls;
    $("countA").textContent = ord(S.infusion) + " infusion · 1 bag";

    // ---- 1908 cup: brews at once at whatever the water is, and keeps going
    var s2 = S.phase === "idle" ? 0 : S.realMin / tea.steep;
    var bitter = "#2E1407";
    var liqB = s2 <= 1 ? mix(water, tea.liquor, s2) : mix(tea.liquor, bitter, Math.min(1, (s2 - 1) / 5));
    var r2 = $("waterB"); r2.setAttribute("y", topY); r2.setAttribute("height", 276 - topY); r2.setAttribute("fill", liqB); r2.setAttribute("fill-opacity", (.10 + .7 * Math.min(1, s2 + (s2 > 1 ? .2 : 0))).toFixed(3));
    Array.prototype.forEach.call($("cloudB").children, function (c) { c.setAttribute("fill", s2 > 1.5 ? bitter : tea.liquor); });
    $("cloudB").setAttribute("opacity", S.phase === "idle" ? 0 : Math.min(.7, .3 + s2 * .15).toFixed(2));
    $("stainB").setAttribute("opacity", Math.min(.7, s2 * .14).toFixed(2));
    var sB = $("statusB"), m2, c2 = "";
    if (S.phase === "idle") m2 = "Ready.<small>The bag goes in, the clock starts.</small>";
    else if (s2 < .7) m2 = (tea.green ? "Scalding at " + Math.round(t) + "°C." : "Brewing at once.") + "<small>No one is watching the clock.</small>";
    else if (s2 < 1.3) m2 = "Just right, for a moment.<small>Take the bag out now. Now.</small>";
    else if (s2 < 3) m2 = "Stewing.<small>Still in the cup, " + fmt(S.realMin) + " in.</small>";
    else { m2 = "Bitter.<small>The bag is still in. " + fmt(S.realMin) + " steeped.</small>"; c2 = "s-bitter"; }
    sB.innerHTML = m2; sB.className = "status " + c2;
    $("countB").textContent = S.bags1908 + (S.bags1908 === 1 ? " bag used" : " bags used");

    // controls
    $("pour").disabled = S.phase !== "idle";
    var canAgain = S.bag === "sealed" || S.phase === "done";
    $("again").disabled = !canAgain;
    $("again").classList.toggle("pulse", canAgain);
    $("again").textContent = canAgain ? "Brew again · " + ord(S.infusion + 1) : "Brew again";
  }

  // ---- loop
  function frame(ts) {
    if (!S.last) S.last = ts;
    var dt = Math.min(.1, (ts - S.last) / 1000) * S.speed;
    S.last = ts;
    if (S.phase === "pouring" || S.phase === "running") { step(dt); render(); }
    requestAnimationFrame(frame);
  }

  // ---- controls
  $("pour").addEventListener("click", pour);
  $("again").addEventListener("click", again);
  $("reset").addEventListener("click", function () { reset(true); });
  $("fs").addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () {}); }
  });
  function setSpeed(s) { S.speed = s; Array.prototype.forEach.call($("speed").children, function (b) { b.classList.toggle("on", +b.dataset.s === s); }); }
  Array.prototype.forEach.call($("speed").children, function (b) { b.addEventListener("click", function () { setSpeed(+b.dataset.s); }); });
  document.addEventListener("fullscreenchange", function () { $("fs").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });
  // Pitch keys: Space pour / brew again, R reset, F full screen, 1 2 4 speed, arrows change tea
  document.addEventListener("keydown", function (e) {
    if (e.key === " ") { e.preventDefault(); if (!$("again").disabled) again(); else if (!$("pour").disabled) pour(); }
    else if (e.key === "r" || e.key === "R") reset(true);
    else if (e.key === "f" || e.key === "F") $("fs").click();
    else if (e.key === "1" || e.key === "2" || e.key === "4") setSpeed(+e.key);
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { var i = TEAS.indexOf(S.tea) + (e.key === "ArrowRight" ? 1 : -1); choose(TEAS[(i + TEAS.length) % TEAS.length].id); }
  });

  // ---- rehearsal hook: #tea=sencha&min=3.5&infusion=2 jumps straight to that moment (cup minutes after the pour)
  function fromHash() {
    var h = {}; location.hash.slice(1).split("&").forEach(function (kv) { var p = kv.split("="); if (p[0]) h[p[0]] = decodeURIComponent(p[1] || ""); });
    if (h.tea) S.tea = TEAS.filter(function (x) { return x.id === h.tea; })[0] || TEAS[1];
    if (h.min) {
      pour(); S.infusion = +(h.infusion || 1); S.bags1908 = S.infusion;
      var target = +h.min, guard = 0;
      while (S.realMin < target && S.phase !== "done" && guard++ < 200000) step(0.01);
      if (S.phase === "running" || S.phase === "pouring") S.phase = "paused";
    }
    render();
  }
  window.addEventListener("hashchange", function () { reset(true); fromHash(); });
  fromHash();
  requestAnimationFrame(frame);
  window.osme = { state: S, teas: TEAS, pour: pour, again: again, reset: reset, choose: choose, speed: setSpeed };
})();
</script>
</body>
</html>
