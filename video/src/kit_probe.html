<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1920px;height:1080px;background:#0B0B0D}
@font-face{font-family:"Jost";src:url(jost-latin.woff2) format("woff2");font-weight:300 700}
#a,#b{position:absolute;left:160px;width:1600px}#a{top:0}#b{top:560px;left:360px;width:1200px}</style></head><body>
<div id="a"></div><div id="b"></div>
<script>
const load = async (id, f) => { const r = await fetch(f); document.getElementById(id).innerHTML = await r.text(); };
window.ready = Promise.all([load('a','../../brand/motion/three-bubbles.svg'), load('b','../../brand/motion/logo-reveal.svg')]);
window.setT = t => document.querySelectorAll('#a>svg,#b>svg').forEach(s => { s.pauseAnimations(); s.setCurrentTime(t); });
window.DUR = 6;
</script></body></html>
