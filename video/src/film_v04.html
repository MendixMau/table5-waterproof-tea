<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eo = p => 1 - Math.pow(1 - p, 4);
const back = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const seg = (t, a, b, f = eio) => f(clamp((t - a) / (b - a)));
const win = (t, a, b, c, d) => Math.min(seg(t, a, b), 1 - seg(t, c, d));
const set = (el, o) => { for (const k in o) el.setAttribute(k, typeof o[k] === 'number' ? +o[k].toFixed(3) : o[k]); };

// Timeline (s). Total 18.4.
const T = {
  cap1: [-1, 0, 2.9, 3.4],                      // on screen at frame 0
  b: [[-0.6, 0.6], [0.0, 1.2], [0.6, 1.8]],     // bubble rises, 0.6 s apart
  lab: [0.3, 0.9, 1.5], labOut: [2.9, 3.4],
  wait: [3.0, 3.8],                             // bubbles shrink and wait above the glass
  glass: [3.1, 3.9],
  cap2: [3.4, 3.8, 5.9, 6.3],
  oldIn: [3.7, 4.3], dark: [4.2, 5.4], oldOut: [5.4, 6.0], clear: [5.6, 6.3],
  temp: [4.0, 4.5],
  gather: [6.0, 6.9],                           // bubbles drop into the cup (stagger .18) and become the bag
  body: [6.6, 7.2], string: [6.9, 7.6], tagIn: [7.4, 7.8],
  head: 6.4, stateIn: [6.6, 7.1], arc: [6.4, 7.4],
  cool1: [7.5, 8.7],                            // 100 -> 80
  push: [7.9, 8.9], pushOut: [11.1, 11.9],
  open: [8.7, 9.1], plume: 8.75, bleed: [9.5, 11.0],
  cool2: [9.3, 10.7],                           // 80 -> 70
  seal: [10.7, 11.05], ring: [10.9, 11.6],
  arcOut: [11.6, 12.0],
  one: [11.9, 12.4, 13.3, 13.8], panelOut: [13.3, 13.8],
  morph: [13.5, 14.6], sceneOut: [13.5, 14.1],
  word: [14.4, 14.7], tag: [14.7, 15.3],
  end: [17.6, 18.4],
};
const DUR = 18.4;
const HOME = [[480, 520], [960, 520], [1440, 520]];
const R0 = [75, 100, 140], RW = [20, 24, 28];
const WAIT = [[1046, 372], [1120, 360], [1194, 372]];
const BODY = { x: 1054, y: 650, w: 132 };          // bag body in cup coordinates (hero.svg geometry)
const CUP = { s: 1.35, ox: 1120, oy: 905 };         // cupG scale
const toScreen = (x, y) => [CUP.ox + (x - CUP.ox) * CUP.s, CUP.oy + (y - CUP.oy) * CUP.s];
const BAG_S = toScreen(1120, 721);                 // bag centre on screen (cam at 1)
const CAM = { cx: 1120, cy: 330, k: 1.5 };
const END = { cx: 960, top: 196, h: 300 };          // end card symbol
const WORD = { cx: 960, gap: 44, w: 540 };

let cup = null, endS = null, word = null, W = null;
function place(o, x, y, w) { set(o.el, { x, y, width: w, height: w * o.vb[3] / o.vb[2] }); }
function embed(svgText, host) {
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  const vb = (doc.documentElement.getAttribute('viewBox') || '0 0 64 64').split(/[\s,]+/).map(Number);
  // make ids unique per instance (gradients, masks)
  let txt = new XMLSerializer().serializeToString(doc.documentElement);
  for (const id of [...txt.matchAll(/id="([^"]+)"/g)].map(m => m[1]))
    txt = txt.replaceAll(`id="${id}"`, `id="${host}-${id}"`).replaceAll(`url(#${id})`, `url(#${host}-${id})`).replaceAll(`href="#${id}"`, `href="#${host}-${id}"`);
  const src = new DOMParser().parseFromString(txt, 'image/svg+xml').documentElement;
  $(host).innerHTML = '';
  const el = document.createElementNS(NS, 'svg');
  el.setAttribute('viewBox', vb.join(' ')); el.setAttribute('overflow', 'visible');
  for (const n of [...src.childNodes]) el.appendChild(document.importNode(n, true));
  $(host).appendChild(el);
  const o = { el, vb, draw: [], fills: [], body: null, accents: [] };
  for (const e of el.querySelectorAll('path,circle,ellipse,line,polyline,polygon,rect')) {
    if (e.closest('defs,mask,clipPath')) continue;
    const cs = getComputedStyle(e);
    if (cs.stroke && cs.stroke !== 'none') { e.setAttribute('pathLength', '1'); e.style.strokeDasharray = '1 1'; o.draw.push(e); }
    else if (cs.fill && cs.fill !== 'none') o.fills.push(e);
  }
  const area = e => { const b = e.getBBox(); return b.width * b.height; };
  o.fills.sort((a, b) => area(b) - area(a));
  o.body = o.fills[0] || null; o.accents = o.fills.slice(1);
  place(o, 0, 0, vb[2]);                                   // measure at scale 1
  // body box in viewBox units (through any transforms inside the logo file)
  const m = el.getScreenCTM().inverse().multiply(o.body.getScreenCTM()), bb = o.body.getBBox(), s0 = el.getBBox();
  const p0 = new DOMPoint(bb.x, bb.y).matrixTransform(m), p1 = new DOMPoint(bb.x + bb.width, bb.y + bb.height).matrixTransform(m);
  o.bodyAt1 = { x: p0.x, y: p0.y, w: p1.x - p0.x, h: p1.y - p0.y };
  o.contentAt1 = { x: s0.x, y: s0.y, w: s0.width, h: s0.height };
  return o;
}
// split the bag body into two halves that can part (the bag opens) with a glowing seam between them
function makeHalves(o) {
  const b = o.body, bb = b.getBBox(), mid = bb.x + bb.width / 2, par = b.parentNode;
  const defs = document.createElementNS(NS, 'defs'); par.appendChild(defs);
  const mk = (id, x, w) => { const c = document.createElementNS(NS, 'clipPath'); c.id = id; const r = document.createElementNS(NS, 'rect');
    set(r, { x, y: bb.y - 1, width: w, height: bb.height + 2 }); c.appendChild(r); defs.appendChild(c); };

  const [bx, by] = rotPt(930, 500, 720, 560, pt), bs = seg(t, 9.2, 9.45) * (1 - seg(t, 10.4, 10.7));
  set($('bStream'), { d: `M${bx.toFixed(1)} ${by.toFixed(1)} Q${(bx + 120).toFixed(1)} ${(by - 30).toFixed(1)} 1112 ${(620 + 20 * seg(t, 9.4, 10.5)).toFixed(1)}`, opacity: bs });
  $('bFill').setAttribute('y', lerp(392, 292, seg(t, 9.4, 10.6)).toFixed(2));
  steam(BS, t, 9.9, 11.0, 170);
  $('bTemp').setAttribute('opacity', seg(t, 9.8, 10.3).toFixed(3));

  // captions
  let cur = null; for (const c of CH) if (t >= c.a - 0.05 && t <= c.b + 0.4) cur = c;
  const co = cur ? win(t, cur.a, cur.a + 0.35, cur.b, cur.b + 0.35) : 0;
  if (cur) { $('eyebrow').textContent = cur.eb; $('line1').textContent = cur.l1; $('line2').textContent = cur.l2; }
  set($('caps'), { opacity: co, transform: `translate(0 ${cur ? ((1 - seg(t, cur.a, cur.a + 0.35)) * 10).toFixed(1) : 0})` });
  // timeline
  const idx = t < 4.3 ? 0 : t < 7.9 ? 1 : t < 11.3 ? 2 : t < 14.2 ? 3 : 4;
  $('tline').setAttribute('opacity', (seg(t, -1, 0) * (1 - seg(t, 15.4, 15.9))).toFixed(3));
  NODES.forEach((n, i) => {
    const on = i === idx, done = i < idx;
    set(n.c, { r: on ? 14 : 8, opacity: on ? 1 : done ? 0.75 : 0.35 });
    n.c.style.filter = on ? 'drop-shadow(0 0 8px rgba(242,163,58,.8))' : 'none';
    set(n.tx, { opacity: on ? 1 : 0.4 });
  });
};
window.DUR = DUR4;

window.setT(0);
</script>
