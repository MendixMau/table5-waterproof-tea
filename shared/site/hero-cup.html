/* OSME brand tokens - "Midnight Brew" (from brand/identity/tokens.css) */
:root {
  --brand-bg:#0B0B0D; --brand-surface:#17171B; --brand-line:#2A2A30;
  --brand-primary:#F2A33A; --brand-accent:#3DBA9B; --brand-text:#F3EEE6; --brand-muted:#8E8A83;
  --brand-arc-hot:#F2A33A; --brand-arc-mid:#D9C46B; --brand-arc-cool:#3DBA9B;
  --brand-arc:linear-gradient(90deg,var(--brand-arc-hot) 0%,var(--brand-arc-mid) 48%,var(--brand-arc-cool) 100%);
  --brand-glow:0 0 24px rgba(242,163,58,.35),0 0 48px rgba(61,186,155,.18);
  --font-display:"Futura","Jost","Century Gothic","Avenir Next",sans-serif;
  --font-body:"Avenir Next","Avenir","Inter","Helvetica Neue",Arial,sans-serif;
  --fw-display:500; --tracking-display:.18em;
  --fs-hero:clamp(42px,5.7vw,84px); --fs-body:17px; --fs-small:13px;
  --radius-s:4px; --radius-m:10px; --radius-l:20px; --radius-pill:999px;
  --wrap:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--brand-bg);color:var(--brand-text);font-family:var(--font-body);font-size:var(--fs-body);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--brand-accent);text-decoration:none}
a:hover{text-decoration:underline}
img,svg{display:block;max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.caps{font-family:var(--font-display);font-weight:var(--fw-display);letter-spacing:var(--tracking-display);text-transform:uppercase}
.eyebrow{font-family:var(--font-display);font-weight:var(--fw-display);letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:var(--brand-muted)}
.eyebrow b{color:var(--brand-primary);font-weight:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:var(--fw-display);line-height:1.08;letter-spacing:.01em}
h2{font-size:clamp(32px,4.4vw,54px);margin:14px 0 18px}
h3{font-size:21px;letter-spacing:.04em}
.lead{font-size:clamp(17px,1.6vw,20px);color:#CFC9BF;max-width:640px}
.muted{color:var(--brand-muted)}
.arc-text{background:var(--brand-arc);-webkit-background-clip:text;background-clip:text;color:transparent}
section{padding:112px 0;border-top:1px solid var(--brand-line);position:relative}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:var(--fw-display);letter-spacing:.16em;text-transform:uppercase;font-size:13px;border-radius:var(--radius-pill);padding:15px 26px;border:1px solid var(--brand-line);color:var(--brand-text);background:transparent;cursor:pointer;transition:all .25s;white-space:nowrap}
.btn:hover{text-decoration:none;border-color:var(--brand-muted)}
.btn.primary{background:var(--brand-primary);border-color:var(--brand-primary);color:#1A1206;box-shadow:0 0 28px rgba(242,163,58,.28)}
.btn.primary:hover{box-shadow:0 0 40px rgba(242,163,58,.45)}
.dots{display:inline-flex;gap:5px;align-items:center}
.dots i{display:block;border-radius:50%}
.dots i:nth-child(1){width:6px;height:6px;background:var(--brand-arc-cool)}
.dots i:nth-child(2){width:8px;height:8px;background:var(--brand-arc-mid)}
.dots i:nth-child(3){width:10px;height:10px;background:var(--brand-arc-hot)}

/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(42,42,48,.6)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
nav .logo svg{height:46px;width:auto}
nav ul{display:flex;gap:28px;list-style:none}
nav ul a{color:var(--brand-muted);font-family:var(--font-display);letter-spacing:.16em;text-transform:uppercase;font-size:12px}
nav ul a:hover{color:var(--brand-text);text-decoration:none}
nav .btn{padding:10px 18px;font-size:12px}

/* hero */
.hero{border-top:0;padding:56px 0 72px;overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;right:-10%;top:-20%;width:70vw;height:70vw;max-width:900px;max-height:900px;background:radial-gradient(closest-side,rgba(242,163,58,.10),rgba(61,186,155,.05) 55%,transparent 75%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:center;position:relative}
.hero h1{font-size:var(--fs-hero);line-height:1.0;margin:18px 0 22px;letter-spacing:-.005em}
.hero h1 span{display:block}
.oneliner{font-size:clamp(20px,2.1vw,27px);line-height:1.3;max-width:560px;font-weight:500}
.oneliner em{font-style:normal;color:var(--brand-primary)}
.hero .sub{margin-top:14px;color:#BDB7AD;max-width:540px}
.facts-row{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 30px}
.chip{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--brand-line);background:rgba(23,23,27,.8);border-radius:var(--radius-pill);padding:9px 16px;font-size:14px;color:#D8D2C8}
.chip b{font-family:var(--font-display);font-weight:var(--fw-display);color:var(--brand-text);letter-spacing:.04em}
.chip .k{font-family:var(--font-display);letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;color:var(--brand-muted)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.hero-visual{position:relative;display:flex;justify-content:center}
.hero-visual svg{width:100%;max-width:480px;height:auto}
.hv-caption{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:12px;color:var(--brand-muted);letter-spacing:.06em}

/* how */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:48px}
.step{background:var(--brand-surface);border:1px solid var(--brand-line);border-radius:var(--radius-l);padding:28px 26px 26px;position:relative;overflow:hidden}
.step .num{font-family:var(--font-display);font-size:12px;letter-spacing:.22em;color:var(--brand-muted)}
.step .temp{font-family:var(--font-display);font-size:54px;line-height:1;margin:18px 0 6px;letter-spacing:.01em}
.step .temp small{font-size:20px;color:var(--brand-muted);margin-left:4px}
.step .state{font-family:var(--font-display);letter-spacing:.2em;text-transform:uppercase;font-size:13px;margin-bottom:12px}
.step p{color:#BDB7AD;font-size:15.5px}
.step .mini{height:120px;margin:4px 0 6px}
.step.hot .temp,.step.hot .state{color:var(--brand-primary)}
.step.open{border-color:rgba(217,196,107,.45);box-shadow:inset 0 0 60px rgba(217,196,107,.06)}
.step.open .temp,.step.open .state{color:var(--brand-arc-mid)}
.step.cool .temp,.step.cool .state{color:var(--brand-accent)}
.arcbar{height:4px;border-radius:4px;background:var(--brand-arc);margin:30px 0 10px;position:relative}
.arcbar-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--brand-muted);letter-spacing:.06em}

.tryit{margin-top:22px;display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
.panel{background:var(--brand-surface);border:1px solid var(--brand-line);border-radius:var(--radius-l);padding:28px}
.slider-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.readout{font-family:var(--font-display);font-size:64px;line-height:1;min-width:150px}
.readout small{font-size:22px;color:var(--brand-muted)}
.sstate{font-family:var(--font-display);letter-spacing:.2em;text-transform:uppercase;font-size:14px}
.sdesc{color:#BDB7AD;font-size:15px;margin-top:4px;max-width:380px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--brand-arc-hot),var(--brand-arc-mid) 50%,var(--brand-arc-cool));outline:none;margin:26px 0 8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--brand-text);border:5px solid var(--brand-bg);box-shadow:0 0 0 1px var(--brand-muted),0 0 18px rgba(242,163,58,.4);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--brand-text);border:5px solid var(--brand-bg);cursor:grab}
.range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--brand-muted)}
.panel.demo{display:flex;flex-direction:column;justify-content:space-between;gap:18px;background:linear-gradient(160deg,#1d1a14,#17171B 55%,#131a18)}
.panel.demo p{color:#CFC9BF;font-size:15.5px}
.honest{margin-top:26px;display:flex;gap:14px;align-items:flex-start;color:#A9A399;font-size:14.5px;max-width:860px}
.honest b{color:var(--brand-text);font-weight:600}
.honest .tag{flex:none;font-family:var(--font-display);letter-spacing:.2em;font-size:10.5px;text-transform:uppercase;border:1px solid var(--brand-line);border-radius:var(--radius-pill);padding:4px 10px;color:var(--brand-accent);margin-top:2px}

/* story timeline */
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:44px;position:relative}
.timeline::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:linear-gradient(90deg,var(--brand-arc-mid),#555 50%,var(--brand-arc-cool))}
.tl{padding-right:30px;position:relative}
.tl::before{content:"";display:block;width:20px;height:20px;border-radius:50%;background:var(--brand-bg);border:2px solid var(--brand-arc-mid);margin-bottom:22px;position:relative}
.tl:nth-child(2)::before{border-color:#666}
.tl:nth-child(3)::before{border-color:var(--brand-accent);background:var(--brand-accent);box-shadow:0 0 18px rgba(61,186,155,.6)}
.tl .yr{font-family:var(--font-display);font-size:40px;line-height:1}
.tl h3{margin:10px 0 8px;font-size:18px}
.tl p{color:#BDB7AD;font-size:15.5px}
.tl blockquote{margin-top:12px;font-style:italic;color:#CFC9BF;font-size:14.5px;border-left:2px solid var(--brand-line);padding-left:12px}

/* teas */
.cultures{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:48px}
.culture{background:var(--brand-surface);border:1px solid var(--brand-line);border-radius:var(--radius-l);overflow:hidden;display:flex;flex-direction:column}
.culture header{padding:26px 26px 18px;border-bottom:1px solid var(--brand-line)}
.culture .country{font-family:var(--font-display);font-size:30px;letter-spacing:.06em}
.culture .ritual{color:var(--brand-muted);font-size:14px;margin-top:6px}
.tea-row{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:16px 26px;border-bottom:1px solid rgba(42,42,48,.6)}
.tea-row:last-of-type{border-bottom:0}
.liquor{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 0 16px var(--glow,rgba(0,0,0,0))}
.tea-row b{font-family:var(--font-display);font-weight:var(--fw-display);letter-spacing:.06em;display:block;font-size:16px}
.tea-row span{font-size:13px;color:var(--brand-muted)}
.window{font-family:var(--font-display);text-align:right;font-size:15px;white-space:nowrap}
.window small{display:block;font-family:var(--font-body);font-size:11px;color:var(--brand-muted);letter-spacing:.04em}
.culture footer{margin-top:auto;padding:16px 26px 22px;font-size:14px;color:#BDB7AD;font-style:italic;border-top:1px solid var(--brand-line)}
.tea-row.star{background:rgba(217,196,107,.06)}

/* who */
.who-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.who{padding:28px 26px;border:1px solid var(--brand-line);border-radius:var(--radius-l);background:linear-gradient(180deg,#151518,#111113)}
.who .ico{height:44px;margin-bottom:18px}
.who h3{margin-bottom:10px}
.who p{color:#BDB7AD;font-size:15.5px}
.who .stat{margin-top:18px;padding-top:16px;border-top:1px solid var(--brand-line);font-size:13.5px;color:var(--brand-muted)}
.who .stat b{display:block;font-family:var(--font-display);font-weight:var(--fw-display);font-size:28px;color:var(--brand-text);letter-spacing:.02em;margin-bottom:2px}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.quote{padding:28px 26px 22px;border-radius:var(--radius-l);background:var(--brand-surface);border:1px solid var(--brand-line);display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.quote q{font-family:var(--font-display);font-size:19px;line-height:1.38;quotes:"\201C" "\201D"}
.quote q::before{color:var(--brand-primary)}
.quote q::after{color:var(--brand-primary)}
.quote cite{font-style:normal;font-size:13px;color:var(--brand-muted)}
.quote cite a{color:var(--brand-muted);text-decoration:underline;text-underline-offset:3px}
.quote .fix{font-size:12px;font-family:var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--brand-accent)}

/* price */
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:48px;align-items:stretch}
.price{border:1px solid var(--brand-line);border-radius:var(--radius-l);padding:32px 28px;background:var(--brand-surface);display:flex;flex-direction:column}
.price .name{font-family:var(--font-display);letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--brand-muted)}
.price .amt{font-family:var(--font-display);font-size:64px;line-height:1;margin:18px 0 4px;letter-spacing:.005em}
.price .amt small{font-size:20px;color:var(--brand-muted);letter-spacing:.04em}
.price .unit{color:#CFC9BF;font-size:15px}
.price ul{list-style:none;margin:22px 0 26px;display:grid;gap:9px;font-size:15px;color:#BDB7AD}
.price li{display:flex;gap:10px}
.price li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--brand-accent);margin-top:9px}
.price .btn{margin-top:auto;justify-content:center}
.price.ritual{border-color:rgba(242,163,58,.55);background:linear-gradient(170deg,#241c10,#17171B 45%);box-shadow:0 0 60px rgba(242,163,58,.08)}
.price.ritual .name{color:var(--brand-primary)}
.badge{align-self:flex-start;font-family:var(--font-display);letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;color:#1A1206;background:var(--brand-primary);border-radius:var(--radius-pill);padding:4px 10px;margin-bottom:14px}
.percup{margin-top:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:22px 28px;border:1px dashed var(--brand-line);border-radius:var(--radius-l)}
.percup .big{font-family:var(--font-display);font-size:40px;line-height:1}
.percup p{color:#BDB7AD;font-size:15px;max-width:640px}

/* movement */
.movement{background:radial-gradient(ellipse at 50% 0%,rgba(61,186,155,.07),transparent 60%)}
.mv{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.manifesto{font-family:var(--font-display);font-size:clamp(22px,2.4vw,31px);line-height:1.42}
.manifesto p{margin:0}
.manifesto .gap{height:.7em}
.manifesto .sig{margin-top:22px;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--brand-primary)}
.ritual-card{border:1px solid var(--brand-line);border-radius:var(--radius-l);padding:30px;background:var(--brand-surface)}
.bubbles{display:grid;gap:18px;margin:22px 0 6px}
.bubble{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:center}
.bubble .b{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--brand-line)}
.bubble .b i{display:block;border-radius:50%}
.bubble b{font-family:var(--font-display);font-weight:var(--fw-display);letter-spacing:.08em;display:block}
.bubble span{font-size:14px;color:var(--brand-muted)}
.hashtag{font-family:var(--font-display);font-size:26px;letter-spacing:.04em;margin-top:18px}
.join{margin-top:72px;padding:48px;border-radius:28px;border:1px solid var(--brand-line);background:linear-gradient(120deg,rgba(242,163,58,.10),rgba(23,23,27,.6) 40%,rgba(61,186,155,.10));display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.join h2{margin:10px 0 10px}
form.wl{display:flex;gap:10px;flex-wrap:wrap}
form.wl input{flex:1 1 220px;min-width:0;background:var(--brand-bg);border:1px solid var(--brand-line);color:var(--brand-text);border-radius:var(--radius-pill);padding:15px 22px;font-size:16px;font-family:var(--font-body);outline:none}
form.wl input:focus{border-color:var(--brand-primary)}
.wl-msg{margin-top:14px;font-size:15px;color:var(--brand-accent);min-height:24px}
.wl-note{font-size:12.5px;color:var(--brand-muted);margin-top:6px}

/* footer */
footer.site{padding:64px 0 48px;border-top:1px solid var(--brand-line);font-size:13px;color:var(--brand-muted)}
footer.site .top{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:flex-start;margin-bottom:34px}
footer.site .top svg{height:30px;width:auto}
footer.site h4{font-family:var(--font-display);font-weight:var(--fw-display);letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--brand-text);margin-bottom:14px}
footer.site ol{columns:2;column-gap:40px;padding-left:18px}
footer.site li{margin-bottom:8px;break-inside:avoid;line-height:1.45}
footer.site li a{color:#A9A399;text-decoration:underline;text-underline-offset:2px;word-break:break-word}
footer.site .fine{margin-top:30px;padding-top:20px;border-top:1px solid var(--brand-line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}


@media (max-width:980px){
  nav ul{display:none}
  .hero .wrap{grid-template-columns:1fr;gap:10px}
  .hero-visual svg{max-width:380px}
  .steps,.cultures,.who-grid,.quotes,.prices,.timeline{grid-template-columns:1fr}
  .tryit,.mv,.join{grid-template-columns:1fr}
  .timeline::before{left:9px;right:auto;top:0;bottom:0;width:2px;height:auto;background:linear-gradient(180deg,var(--brand-arc-mid),#555 50%,var(--brand-arc-cool))}
  .tl{padding:0 0 34px 44px}
  .tl::before{position:absolute;left:0;top:4px;margin:0}
  footer.site ol{columns:1}
}
@media (max-width:560px){
  .wrap{padding:0 20px}
  section{padding:80px 0}
  .hero{padding:28px 0 56px}
  nav .wrap{height:60px}
  nav .logo svg{height:28px}
  nav .btn{padding:9px 14px;font-size:11px;letter-spacing:.12em}
  .hero h1{margin:12px 0 16px}
  .facts-row{margin:22px 0 24px}
  .chip{font-size:13px;padding:8px 13px;border-radius:18px}
  .say{display:none}
  .hero-visual svg{max-width:330px}
  .step .temp,.price .amt{font-size:52px}
  .readout{font-size:52px;min-width:0}
  .join{padding:30px 22px}
  .tea-row{padding:14px 20px}
  .culture header{padding:22px 20px 16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ================= multi-page shop (on top of base.css) ================= */
:root{--font-display:"Jost","Futura","Century Gothic",sans-serif;--font-body:"Jost","Avenir Next","Helvetica Neue",Arial,sans-serif}
body{font-weight:400}
.btn.sm{padding:10px 16px;font-size:11.5px;letter-spacing:.14em;gap:6px}
.btn.grow{flex:1;justify-content:center}
.small{font-size:var(--fs-small)}
section.tight{padding:72px 0}
.h1{font-size:clamp(38px,5vw,68px);line-height:1.02;margin:14px 0 18px}
.page-head{padding:72px 0 56px;position:relative;overflow:hidden}
.page-head::before{content:"";position:absolute;right:-12%;top:-40%;width:60vw;height:60vw;max-width:760px;max-height:760px;background:radial-gradient(closest-side,rgba(242,163,58,.09),rgba(61,186,155,.04) 55%,transparent 75%);pointer-events:none}
.page-head .wrap{position:relative}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:34px}
.sec-head h2{margin-bottom:8px}

/* nav */
nav.top .links a[aria-current]{color:var(--brand-text);border-bottom:1px solid var(--brand-primary);padding-bottom:4px}
.nav-r{display:flex;align-items:center;gap:12px}
.cart-btn{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--brand-line);background:transparent;color:var(--brand-text);cursor:pointer}
.cart-btn:hover{border-color:var(--brand-muted)}
.cart-n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--brand-line);color:var(--brand-muted);font-size:11px;line-height:19px;text-align:center;font-weight:600}
.cart-n.on{background:var(--brand-primary);color:#1A1206}
.menu-btn{display:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--brand-line);background:transparent;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.menu-btn span{display:block;width:16px;height:1.6px;background:var(--brand-text);transition:transform .2s}
.menu-open .menu-btn span:first-child{transform:translateY(3.3px) rotate(45deg)}
.menu-open .menu-btn span:last-child{transform:translateY(-3.3px) rotate(-45deg)}
.mobile-menu{display:none;background:#0B0B0D}
.mobile-menu li.cta{border:0;padding-top:14px}
.mobile-menu li.cta .btn{display:flex;justify-content:center;padding:14px;font-size:12px!important}
nav .mobile-menu ul{display:flex;flex-direction:column;gap:0;padding:6px 20px 18px}
.mobile-menu li{border-top:1px solid var(--brand-line)}
.mobile-menu a{display:block;padding:15px 0;font-size:14px!important}

/* tea cards */
.tea-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.tea-card{background:var(--brand-surface);border:1px solid var(--brand-line);border-radius:var(--radius-l);overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,transform .25s}
.tea-card:hover{border-color:#3A3A42;transform:translateY(-2px)}
.tc-img{display:block;background:radial-gradient(closest-side at 50% 60%,#1F1F25,#121215);padding:18px 40px 0}
.tc-img svg{width:100%;height:auto;max-height:300px}
.tc-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.tc-body .eyebrow{font-size:10.5px;letter-spacing:.2em}
.tc-body h3{font-size:26px;letter-spacing:.04em}
.tc-body h3 a{color:var(--brand-text)}
.tc-window{display:flex;align-items:center;gap:9px;font-size:14px;color:#CFC9BF}
.tc-window .liquor,.tea-row .liquor{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 12px rgba(0,0,0,.4) inset}
.tc-buy{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.tc-buy .btn{flex:1;justify-content:center}
.tea-grid.scroll{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(250px,1fr);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.tea-grid.scroll .tea-card{scroll-snap-align:start}
.tea-grid.scroll .tc-img{padding:14px 48px 0}

/* video band */
.band{padding:0;min-height:420px;display:flex;align-items:center;overflow:hidden}
.band video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,13,.92) 0%,rgba(11,11,13,.55) 55%,rgba(11,11,13,.2) 100%)}
.band-in{position:relative;z-index:1;padding-top:80px;padding-bottom:80px;width:100%}
.band-h{font-family:var(--font-display);font-size:clamp(28px,3.6vw,46px);line-height:1.12;margin:14px 0 24px;max-width:640px}
.band-steps{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--font-display);letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#CFC9BF}
.band-steps span{display:flex;align-items:center;gap:9px}
.band-steps i{display:block;border-radius:50%}

/* demo panel, ritual teaser */
.panel.demo{display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.panel.demo .btn{align-self:flex-start}
.rt{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center;background:linear-gradient(135deg,#1A1712,#17171B 60%);border:1px solid #3A3226;border-radius:28px;padding:48px 56px}
.rt-img img{max-height:400px;margin:0 auto}
.amt-xl{font-family:var(--font-display);font-size:clamp(56px,6vw,84px);line-height:1;margin:14px 0 14px}
.amt-xl small{font-size:.3em;color:var(--brand-muted);letter-spacing:.08em}
.badge{display:inline-block;font-family:var(--font-display);letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;color:#1A1206;background:var(--brand-primary);border-radius:var(--radius-pill);padding:5px 12px}

/* shop */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.chip-btn{font-family:var(--font-display);letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--brand-muted);background:transparent;border:1px solid var(--brand-line);border-radius:var(--radius-pill);padding:9px 18px;cursor:pointer}
.chip-btn:hover{color:var(--brand-text)}
.chip-btn.on{color:var(--brand-text);border-color:var(--brand-primary);background:rgba(242,163,58,.08)}
.ritual-strip{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:linear-gradient(90deg,#1E1912,#17171B);border:1px solid #3A3226;border-radius:var(--radius-l);padding:18px 24px;margin-bottom:28px;color:#CFC9BF;font-size:15px}
.ritual-strip:hover{text-decoration:none;border-color:var(--brand-primary)}
.ritual-strip b{font-family:var(--font-display);font-weight:500;color:var(--brand-text);letter-spacing:.06em;font-size:18px}
.ritual-strip .go{margin-left:auto;color:var(--brand-primary);font-size:22px}
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:48px}
.ben{display:flex;gap:16px;align-items:flex-start;border-top:1px solid var(--brand-line);padding-top:22px}
.ben img{flex:none;width:48px;height:48px}
.ben b{font-family:var(--font-display);font-weight:500;letter-spacing:.06em;font-size:17px}
.ben p{color:var(--brand-muted);font-size:15px;margin-top:4px}

/* product page */
.product{border-top:0;padding:40px 0 80px}
.crumbs{font-size:13px;color:var(--brand-muted);letter-spacing:.06em;margin-bottom:26px}
.crumbs a{color:var(--brand-muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
.p-art{background:radial-gradient(closest-side at 50% 55%,#202027,#111114);border:1px solid var(--brand-line);border-radius:28px;padding:36px 70px 10px;position:sticky;top:92px}
.p-art svg{width:100%;height:auto}
.p-info .h1{margin-top:10px}
.p-line{font-size:clamp(19px,1.8vw,23px);color:#CFC9BF;line-height:1.4}
.p-window{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 8px}
.p-window>div{background:var(--brand-surface);border:1px solid var(--brand-line);border-radius:var(--radius-m);padding:14px 16px}
.p-window .k{display:block;font-family:var(--font-display);letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--brand-muted)}
.p-window b{font-family:var(--font-display);font-weight:500;font-size:24px;display:block;margin-top:4px;white-space:nowrap}
.gauge{width:100%;height:auto;margin:6px 0 22px}
.options{display:grid;gap:10px;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:14px;border:1px solid var(--brand-line);border-radius:var(--radius-m);padding:14px 18px;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:#3A3A42}
.opt input{accent-color:var(--brand-primary);width:18px;height:18px;flex:none}
.opt span{flex:1}
.opt b{display:block;font-family:var(--font-display);font-weight:500;letter-spacing:.05em}
.opt small{color:var(--brand-muted);font-size:13px}
.opt em{font-style:normal;font-family:var(--font-display);font-size:19px;white-space:nowrap}
.opt:has(input:checked){border-color:var(--brand-primary);background:rgba(242,163,58,.06)}
.buy-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.qty{display:flex;align-items:center;border:1px solid var(--brand-line);border-radius:var(--radius-pill);height:50px}
.qty button{width:44px;height:100%;background:transparent;border:0;color:var(--brand-text);font-size:20px;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-family:var(--font-display)}
.qty.sm{height:34px}.qty.sm button{width:30px;font-size:16px}
.p-info>.btn{margin-top:10px}
.p-cols{display:grid;grid-template-columns:1fr 1fr;gap:56px}

.p-gal{position:sticky;top:92px}
.p-gal .p-art{position:relative;top:auto}
.p-bag{display:none;width:100%;height:auto;margin-bottom:26px;border-radius:16px}
.p-art[data-view="bag"] .tin{display:none}
.p-art[data-view="bag"] .p-bag{display:block}
.thumbs{display:flex;gap:10px;justify-content:center;margin-top:14px}
.thumbs button{font-family:var(--font-display);letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;color:var(--brand-muted);background:transparent;border:1px solid var(--brand-line);border-radius:var(--radius-pill);padding:8px 16px;cursor:pointer}
.thumbs button.on{color:var(--brand-text);border-color:var(--brand-primary)}
.notes{margin-top:14px;font-size:16px;color:#CFC9BF}
.notes .k{font-family:var(--font-display);letter-spacing:.18em;text-transform:uppercase;font-size:10.5px;color:var(--brand-muted);margin-right:12px}
.faq{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px}
.faq details{border-top:1px solid var(--brand-line);padding:18px 0}
.faq details:last-child{border-bottom:1px solid var(--brand-line)}
.faq summary{cursor:pointer;font-family:var(--font-display);font-weight:500;letter-spacing:.03em;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brand-primary);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq details p{color:#BDB7AD;margin-top:10px;max-width:620px}

/* ritual page */
.rgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.ticks{list-style:none;display:grid;gap:10px;margin-top:8px}
.ticks li{position:relative;padding-left:28px;color:#CFC9BF}
.ticks li::before{content:"";position:absolute;left:2px;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--brand-arc)}
.box-vis{background:var(--brand-surface);border:1px solid var(--brand-line);border-radius:28px;padding:32px}
.bag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.bag-grid i{display:block;aspect-ratio:.78;border-radius:7px 7px 9px 9px;background:linear-gradient(180deg,#F3EEE6 0 34%,var(--c) 34%);clip-path:polygon(0 18%,18% 0,82% 0,100% 18%,100% 100%,0 100%);opacity:.92}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:#CFC9BF}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:11px;height:11px;border-radius:50%;display:block}
.r-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:22px}
.r-steps>div{background:var(--brand-surface);border:1px solid var(--brand-line);border-radius:var(--radius-l);padding:26px 24px}
.r-steps .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--brand-primary);color:var(--brand-primary);font-family:var(--font-display);margin-bottom:14px}
.r-steps b{display:block;font-family:var(--font-display);font-weight:500;letter-spacing:.05em;font-size:18px;margin-bottom:6px}
.r-steps p{color:var(--brand-muted);font-size:15px}

/* story, keepers */
.tl blockquote{margin-top:12px;font-style:italic;color:#CFC9BF;font-size:15px;border-left:2px solid var(--brand-arc-cool);padding-left:12px}
.motif{width:100%;height:auto;border-radius:var(--radius-l);margin-bottom:34px;opacity:.9}
a.tea-row{color:inherit}
a.tea-row:hover{text-decoration:none;background:#1C1C21}
.k-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.k-grid img{border-radius:var(--radius-l);border:1px solid var(--brand-line)}
.k-grid .ticks{margin-top:22px}
.kcount{margin-top:18px;font-size:15px;color:#CFC9BF}
.kcount b{font-family:var(--font-display);font-size:28px;color:var(--brand-accent);margin-right:6px}
form.wl.done input{border-color:var(--brand-accent)}

/* cart drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#121215;border-left:1px solid var(--brand-line);z-index:41;transform:translateX(100%);visibility:hidden;transition:transform .3s,visibility .3s;display:flex;flex-direction:column}
.cart-open .drawer{transform:none;visibility:visible}
.cart-open .drawer-bg{opacity:1;pointer-events:auto}
.cart-open{overflow:hidden}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--brand-line)}
.drawer .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--brand-line);background:transparent;color:var(--brand-text);font-size:20px;cursor:pointer}
.drawer-items{flex:1;overflow-y:auto;padding:8px 24px}
.drawer-items .empty{padding:40px 0;text-align:center;color:var(--brand-muted)}
.drawer-items .empty p{margin-bottom:18px}
.drawer-items .empty .btn{margin:4px}
.ci{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--brand-line)}
.ci b{font-family:var(--font-display);font-weight:500;letter-spacing:.04em;display:block}
.ci small{color:var(--brand-muted);font-size:12.5px;line-height:1.3;display:block}
.ci em{font-style:normal;font-family:var(--font-display);white-space:nowrap}
.ci-q{color:var(--brand-muted);font-size:14px;padding:0 10px}
.ci .rm{background:transparent;border:0;color:var(--brand-muted);font-size:18px;cursor:pointer;width:22px}
.drawer-foot{padding:20px 24px 24px;border-top:1px solid var(--brand-line);background:#0F0F12}
.drawer-foot .total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.drawer-foot .total b{font-size:24px;letter-spacing:.02em;text-transform:none}
.drawer-foot [data-cart-percup]{margin:4px 0 14px}
.preorder p.small{color:#BDB7AD;margin-bottom:12px}
.drawer form.wl{flex-direction:column;max-width:none}
.drawer form.wl input,.drawer form.wl .btn{width:100%;flex:none;justify-content:center}
.drawer .wl-msg{margin-top:10px;font-size:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--brand-surface);border:1px solid var(--brand-line);border-radius:var(--radius-pill);padding:11px 20px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* footer extras */
footer.site .top{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;margin-bottom:34px}
.flogo{height:52px;width:auto}
.fcols{display:flex;gap:64px}
.fcols h4{font-family:var(--font-display);letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--brand-muted);margin-bottom:12px;font-weight:500}
.fcols a{display:block;color:#CFC9BF;font-size:15px;margin-bottom:8px}

@media (max-width:980px){
  .menu-btn{display:flex}
  .menu-open .mobile-menu{display:block;border-top:1px solid var(--brand-line)}
  nav .nav-r>.btn{display:none}
  .tea-grid,.benefits{grid-template-columns:1fr 1fr}
  .pgrid,.p-cols,.rgrid,.k-grid,.rt,.faq{grid-template-columns:1fr}
  .faq{gap:10px}
  .p-gal{position:static}
  .p-art{position:static;max-width:480px;margin:0 auto;padding:24px 60px 6px}
  .r-steps{grid-template-columns:1fr 1fr}
  .rt{padding:36px 32px;gap:28px}
  .rt-img img{max-height:280px}
}
@media (max-width:600px){
  /* hero order on phone: words, the cup, then price and buttons */
  .hero .wrap{display:flex;flex-direction:column;gap:0}
  .hero-text{display:contents}
  .hero .eyebrow{order:1}.hero h1{order:2}.hero .oneliner{order:3}
  .hero-visual{order:4;margin:18px 0 4px}
  .hero .facts-row{order:5;margin:16px 0 20px}
  .hero .cta-row{order:6}
  .hero .sub{display:none}
  .hero .chip{display:block;line-height:1.5}
  .hero .chip .k{display:inline}
  .hero .chip .k{margin-right:6px}
  .cta-row{display:flex;gap:10px;flex-wrap:nowrap}
  .cta-row .btn{flex:1;justify-content:center;padding:14px 12px;font-size:11.5px;letter-spacing:.12em}
  .tea-grid,.benefits,.r-steps{grid-template-columns:1fr}
  .tea-grid.scroll{grid-auto-columns:78%}
  .tc-img{padding:14px 70px 0}
  .tc-img svg{max-height:240px}
  .sec-head{flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:24px}
  .page-head{padding:44px 0 36px}
  section.tight{padding:56px 0}
  .h1{font-size:clamp(34px,10vw,44px)}
  .p-window b{font-size:19px}
  .p-window>div{padding:12px}
  .p-art{padding:18px 50px 4px}
  .rt{padding:28px 22px;border-radius:22px}
  .band{min-height:360px}
  .band::after{background:linear-gradient(180deg,rgba(11,11,13,.55),rgba(11,11,13,.9))}
  .band-in{padding-top:60px;padding-bottom:60px}
  .ritual-strip .go{display:none}
  .box-vis{padding:22px}
  .fcols{gap:40px}
  .toast{white-space:normal;width:calc(100vw - 40px);text-align:center}
  nav .nav-r{gap:8px}
  .cart-btn,.menu-btn{width:38px;height:38px}
}

.inner .eyebrow{font-size:12px}

    var state, col, dash;
    if (temp > OPEN) { state = "SEALED · TOO HOT"; col = AMBER; dash = "0"; }
    else if (temp >= CLOSE) { state = "OPEN · BREWING"; col = MID; dash = "7 6"; }
    else { state = "SEALED · SCENT KEPT"; col = JADE; dash = "0"; }
    sTxt.textContent = state; sTxt.setAttribute("fill", col);
    needle.setAttribute("fill", temp > OPEN ? "#F3EEE6" : col);
    bagShape.setAttribute("stroke", col); bagShape.setAttribute("stroke-dasharray", dash);
    seam.setAttribute("stroke", col); seam.setAttribute("stroke-dasharray", dash === "0" ? "0" : "3 5");
    liquor.setAttribute("opacity", (brew * 0.62).toFixed(3));
    var open = temp <= OPEN && temp >= CLOSE;
    var pulse = open ? (0.55 + 0.25 * Math.sin(tsec * 3)) : 0;
    bloom.setAttribute("opacity", pulse.toFixed(2));
    bloom.setAttribute("r", (open ? 60 + 40 * brew : 10).toFixed(1));
    leaves.setAttribute("transform", open ? "translate(0 " + (Math.sin(tsec * 2) * 2).toFixed(2) + ")" : "");
    steam.setAttribute("opacity", (0.08 + 0.3 * (temp - TMIN) / (TMAX - TMIN)).toFixed(2));
    steam.setAttribute("transform", "translate(0 " + (-((tsec * 8) % 8)).toFixed(1) + ")");
  }

  if (reduce) { render(75, 0.6, 0); }
  else {
    var CYCLE = 11; /* seconds */
    var start = null;
    var tempAt = function(s){
      if (s < 0.8) return 96;
      var k = (s - 0.8) / (CYCLE - 2.6);
      if (k > 1) return TMIN + 2;
      return TMIN + 2 + (96 - TMIN - 2) * Math.pow(1 - k, 1.35);
    };
    var step = function(ts){
      if (start === null) start = ts;
      var s = ((ts - start) / 1000) % CYCLE;
      var temp = tempAt(s);
      /* brew grows only while open */
      var t80 = null, t70 = null;
      for (var x = 0; x <= CYCLE; x += 0.05) { var v = tempAt(x); if (t80 === null && v <= OPEN) t80 = x; if (t70 === null && v < CLOSE) { t70 = x; break; } }
      var brew = s < t80 ? 0 : Math.min(1, (s - t80) / (t70 - t80));
      if (s > CYCLE - 0.6) brew *= Math.max(0, (CYCLE - s) / 0.6);
      render(temp, brew, ts / 1000);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

}

})();</script>
